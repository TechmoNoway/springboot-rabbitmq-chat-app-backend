spring:
  application:
    name: lynqo-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lynqo?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:lynqo}
    password: ${SPRING_DATASOURCE_PASSWORD:lynqo}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: mysql
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  use-fqn: true
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true

access-token:
  private: ${ACCESS_TOKEN_PRIVATE_KEY_PATH:access-refresh-token-keys/access-token-private.key}
  public: ${ACCESS_TOKEN_PUBLIC_KEY_PATH:access-refresh-token-keys/access-token-public.key}
refresh-token:
  private: ${REFRESH_TOKEN_PRIVATE_KEY_PATH:access-refresh-token-keys/refresh-token-private.key}
  public: ${REFRESH_TOKEN_PUBLIC_KEY_PATH:access-refresh-token-keys/refresh-token-public.key}

lynqo:
  client-url: ${LYNQO_CLIENT_URL:http://localhost:5173}
  security:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  messaging:
    relay:
      host: ${LYNQO_STOMP_RELAY_HOST:${SPRING_RABBITMQ_HOST:localhost}}
      port: ${LYNQO_STOMP_RELAY_PORT:61613}
