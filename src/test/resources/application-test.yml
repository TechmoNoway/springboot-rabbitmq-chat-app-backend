spring:
  datasource:
    url: jdbc:h2:mem:lynqo;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  data:
    redis:
      repositories:
        enabled: false

logging:
  level:
    com.lynqo.backend: INFO

access-token:
  private: build/test-access-token-private.key
  public: build/test-access-token-public.key
refresh-token:
  private: build/test-refresh-token-private.key
  public: build/test-refresh-token-public.key
